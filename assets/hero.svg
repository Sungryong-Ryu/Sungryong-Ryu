<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020604"/>
      <stop offset="0.5" stop-color="#06130B"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="neon" x1="140" y1="80" x2="1040" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1FC96A"/>
      <stop offset="0.5" stop-color="#5AF09A"/>
      <stop offset="1" stop-color="#159447"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop stop-color="#0F8C43" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0F8C43" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop stop-color="#23B95C" stop-opacity=".45"/>
      <stop offset="1" stop-color="#23B95C" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="430" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>

    <circle cx="490" cy="180" r="330" fill="url(#orbA)" filter="url(#blur)">
      <animate attributeName="cx" values="490;710;490" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;220;180" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="250" r="260" fill="url(#orbB)" filter="url(#blur)">
      <animate attributeName="cx" values="810;610;810" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;170;250" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g opacity=".22" filter="url(#glow)">
      <path d="M-40 286 C120 190 190 350 350 257 S610 175 770 268 S1020 342 1240 194" stroke="url(#neon)" stroke-width="2">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M-40 286 C120 190 190 350 350 257 S610 175 770 268 S1020 342 1240 194;M-40 250 C110 350 230 175 380 260 S650 350 800 238 S1050 170 1240 278;M-40 286 C120 190 190 350 350 257 S610 175 770 268 S1020 342 1240 194"/>
      </path>
      <path d="M-40 305 C130 215 220 370 370 280 S650 205 800 290 S1040 360 1240 220" stroke="url(#neon)" stroke-opacity=".35">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
          values="M-40 305 C130 215 220 370 370 280 S650 205 800 290 S1040 360 1240 220;M-40 280 C130 375 240 200 400 285 S660 375 820 262 S1060 195 1240 300;M-40 305 C130 215 220 370 370 280 S650 205 800 290 S1040 360 1240 220"/>
      </path>
    </g>

    <text x="600" y="164" text-anchor="middle" fill="#F6FAF7" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="750" letter-spacing="-1">Hello New.</text>
    <text x="600" y="233" text-anchor="middle" fill="#F6FAF7" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="750" letter-spacing="-1">The Power of Creativity</text>
    <text x="600" y="305" text-anchor="middle" fill="#B2C0B6" fill-opacity=".76" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">PAINTING · POETRY · DESIGN · CODE</text>

    <circle cx="600" cy="363" r="3" fill="#5AF09A">
      <animate attributeName="r" values="3;8;3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="1" y="1" width="1198" height="428" rx="25" stroke="#38CC77" stroke-opacity=".18"/>
  </g>
</svg>
